# Umumiy web (Gunicorn) replika sozlamalari
x-web: &web
  build: .
  image: wms-web:latest
  env_file: .env
  environment:
    DB_HOST: db
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-wms_db}
      POSTGRES_USER: ${DB_USER:-wms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wms_user} -d ${DB_NAME:-wms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    image: wms-web:latest
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  web1:
    <<: *web
    hostname: web1

  web2:
    <<: *web
    hostname: web2

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
