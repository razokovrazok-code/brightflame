{% if is_paginated %}
<div class="flex justify-center items-center gap-2 mt-5">
  {% if page_obj.has_previous %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}" class="btn-secondary">← Oldingi</a>{% endif %}
  <span class="px-4 py-2 text-sm text-gray-600">{{ page_obj.number }}/{{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}" class="btn-secondary">Keyingi →</a>{% endif %}
</div>
{% endif %}
