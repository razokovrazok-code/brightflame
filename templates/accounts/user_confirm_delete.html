{% extends 'base/base.html' %}
{% block page_title %}Foydalanuvchini o'chirish{% endblock %}
{% block content %}
<div class="max-w-md">
  <div class="card text-center">
    <i class="ph-bold ph-warning text-4xl text-red-500 mb-4"></i>
    <h2 class="text-lg font-semibold mb-2">Rostdan ham o'chirmoqchimisiz?</h2>
    <p class="text-gray-500 mb-6">{{ target_user.username }} foydalanuvchisi o'chiriladi.</p>
    <div class="flex justify-center gap-3">
      <form method="post">{% csrf_token %}<button type="submit" class="btn-danger">O'chirish</button></form>
      <a href="{% url 'accounts:user_list' %}" class="btn-secondary">Bekor qilish</a>
    </div>
  </div>
</div>
{% endblock %}
