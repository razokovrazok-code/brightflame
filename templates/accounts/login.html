<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — WMS Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-900 via-purple-800 to-indigo-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 backdrop-blur rounded-2xl mb-4">
        <i class="ph-bold ph-warehouse text-white text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-white">WMS Pro</h1>
      <p class="text-purple-200 mt-1">Ombor boshqaruv tizimi</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">Tizimga kirish</h2>

      {% if form.errors %}
      <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-center gap-2 text-red-700 text-sm">
        <i class="ph-bold ph-warning-circle flex-shrink-0"></i>
        Login yoki parol noto'g'ri. Qaytadan urinib ko'ring.
      </div>
      {% endif %}

      <form method="post" class="space-y-5">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Foydalanuvchi nomi</label>
          <div class="relative">
            <i class="ph-bold ph-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" name="username" required autofocus
              class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="username">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Parol</label>
          <div class="relative">
            <i class="ph-bold ph-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="password" name="password" required
              class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="••••••••">
          </div>
        </div>
        <button type="submit"
          class="w-full bg-purple-700 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-purple-800 transition-colors flex items-center justify-center gap-2">
          <i class="ph-bold ph-sign-in"></i> Kirish
        </button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </div>

    <p class="text-center text-purple-300 text-xs mt-6">
      Demo: <strong class="text-white">admin</strong> / <strong class="text-white">Admin1234!</strong>
    </p>
  </div>
</body>
</html>
