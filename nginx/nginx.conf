worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Har bir so'rov qaysi replikaga ketganini logda ko'rish uchun
    log_format upstream_log '$remote_addr - [$time_local] "$request" $status '
                            'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Load balancer ────────────────────────────────────────────────────
    # least_conn: so'rov eng kam band replikaga yuboriladi.
    # max_fails/fail_timeout: 3 marta xato bergan replika 30s ga chetlatiladi
    # (passive health check), qolganlari trafikni oladi.
    upstream wms_backend {
        least_conn;
        server web1:8000 max_fails=3 fail_timeout=30s;
        server web2:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # nginx'ning o'z holati (backend'ga bog'liq emas)
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://wms_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Replika ishlamay qolsa so'rov keyingisiga o'tkaziladi.
            # POST kabi idempotent bo'lmagan so'rovlar qayta yuborilmaydi
            # (nginx standarti), shuning uchun ikki marta yozilish xavfi yo'q.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
